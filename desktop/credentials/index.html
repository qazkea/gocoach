<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'">
<title>配置 DeepSeek Key</title><link rel="stylesheet" href="style.css"><script src="form.js" defer></script></head>
<body><h1>配置 DeepSeek Key</h1><p>只保存到本机；此操作不发请求、不验证余额。</p><p>尚未启用在线讲解。不会显示已保存的 Key。</p>
<label for="key">DeepSeek Key</label><input id="key" type="password" autocomplete="off" spellcheck="false" autofocus>
<p id="error" role="alert" aria-live="polite"></p><button id="save" type="button">保存</button><button id="cancel" type="button">取消</button>
<p class="note">本机加密不能防止同一 Windows 用户下的恶意程序。</p></body></html>
